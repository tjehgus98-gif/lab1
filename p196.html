<html>
    <head>
        <meta charset = "utf-8"/>
    </head>
    <body>
        <script>
            function MyPosition()
            {
                if(navigator.geolocation)
                {
                    navigator.geolocation.getCurrentPosition(CurPosition,ErrorCallback);
                }
            }
            function CurPosition(Position)
            {
                var lat = Position.coords.latitude;
                var lng = Position.coords.longitude;
                document.getElementById("result").innerHTML = "위도:"+lat+"경도:"+lng;
            }
            function ErrorCallback(error)
            {
                switch(error.code)
                {
                    case error.PERMISSION_DENIED:
                        document.getElementById("result").innerHTML=" 위치정보에 대한 권한이 없습니다";
                        break;
                    case error.POSITION_UNAVAILABLE:CurPosition    
                            document.getElementById("result").innerHTML =" 현재위치 정보를 구할수 없습니다";
                            break;
                    case error.TIMEOUT:CurPosition  
                            document.getElementById("result").innerHTML="시간제한을 초과했습니다";
                            break;
                }
            }
        </script>
        <button onclick="MyPosition()" type="button">나의 현재 위치</button><p>
        <div id = "result"></div>
    </body>
</html>
